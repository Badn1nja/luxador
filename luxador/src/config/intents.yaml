# Intent layering. Each 5 minutes the model gives a probability per intent; of those that clear their
# min_confidence, the highest priority wins (otherwise the single most probable one).
#   wake beats sleep  -> the day starting always wins
#   sleep beats nightlight -> a 3am trip to the loo stays dim, it doesn't end the night
intents:
  wake:       { priority: 90, min_confidence: 0.45 }
  sleep:      { priority: 80, min_confidence: 0.60 }
  nightlight: { priority: 60, min_confidence: 0.40 }
  evening:    { priority: 40, min_confidence: 0.30 }
  day:        { priority: 30, min_confidence: 0.30 }
  away:       { priority: 20, min_confidence: 0.50 }

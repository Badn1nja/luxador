ha_url: ""                # e.g. http://homeassistant.local:8123 (auto-uses supervisor inside HA App)
ha_token: ""              # or set LUXADOR_HA_TOKEN env var
dry_run: true             # Safe default: simulates & logs commands without changing real bulbs
tick_seconds: 5
db_path: "data/luxie.db"
host: "0.0.0.0"
port: 8099
presence_settle_seconds: 45   # a presence pattern must hold this long before it counts (kills flicker)

# Phase 1 · Data (house-wide inputs for the 5-minute grid and the intent model)
outdoor_lux_sensor: ""        # e.g. sensor.garden_illuminance (optional; sun elevation is used either way)
sun_entity: sun.sun
time_zone: ""                 # blank = Home Assistant's own time zone
max_states: 28                # most states Luxie may discover from your data (fewer if the data does not support them)
latitude: ""                  # blank = Home Assistant's home location (used for the yearly sun model)
longitude: ""

# The general curve (docs/STANDARD.md §2): how much light a level of darkness needs. Tunable live in Luxie.
curve:
  dark_lux: 15                # indoor daylight at/below this = fully dark
  bright_lux: 250             # at/above this the room needs no light
  min_pct: 10
  max_pct: 100
  shape: 0.8                  # < 1 rises early (gentle), > 1 rises late
  night_from: "23:00"
  night_to: "06:00"
  night_max_pct: 35
  colour_schema: sun
  darkness_source: ambient    # ambient = room lux minus our own lights; sun = sun elevation only

# Seasonal compensation from the yearly sun model (computed for your latitude, so either hemisphere works)
seasonal:
  enabled: false              # true = apply to the lights (still subject to dry_run)
  winter_boost_max_pct: 15    # extra daytime brightness on the shortest day, scaled by how short the day is
  winter_kelvin_shift: 300    # slightly cooler daytime light on short days
  summer_shift_factor: 0.33   # evening curve moves by this share of how much later sunset is than at the equinox
  summer_later_max_min: 45    # ...capped here
  winter_earlier_max_min: 0   # 0 = never pull evenings earlier in winter
  day_start: "07:00"          # winter lift applies between these times
  day_end: "20:00"

detail_days: 90              # days of full detail kept (raw HA history + 5-min grid). Older data is folded into a tiny forever seasonal table.

# OPNsense network signals (laptop online / actively moving data). API key needs
# 'Diagnostics: ARP Table' + 'Reporting: Traffic' privileges. Prefer env vars for the secret:
# LUXADOR_OPNSENSE_URL / LUXADOR_OPNSENSE_KEY / LUXADOR_OPNSENSE_SECRET
opnsense:
  url: ""                 # e.g. https://192.168.1.1
  api_key: ""
  api_secret: ""
  verify_ssl: true        # set false only if OPNsense uses its self-signed cert
  interface: lan
  poll_seconds: 15

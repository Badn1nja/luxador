ha_url: ""                # e.g. http://homeassistant.local:8123 (auto-uses supervisor inside HA App)
ha_token: ""              # or set LUXADOR_HA_TOKEN env var
dry_run: true             # Safe default: simulates & logs commands without changing real bulbs
tick_seconds: 5
db_path: "data/luxie.db"
host: "0.0.0.0"
port: 8099
presence_settle_seconds: 45   # a presence pattern must hold this long before it counts (kills flicker)

# Phase 1 · Data (house-wide inputs for the 5-minute grid and the intent model)
outdoor_lux_sensor: ""        # e.g. sensor.garden_illuminance (optional; sun elevation is used either way)
sun_entity: sun.sun
time_zone: ""                 # blank = Home Assistant's own time zone
max_states: 28                # most states Luxie may discover from your data (fewer if the data does not support them)

# OPNsense network signals (laptop online / actively moving data). API key needs
# 'Diagnostics: ARP Table' + 'Reporting: Traffic' privileges. Prefer env vars for the secret:
# LUXADOR_OPNSENSE_URL / LUXADOR_OPNSENSE_KEY / LUXADOR_OPNSENSE_SECRET
opnsense:
  url: ""                 # e.g. https://192.168.1.1
  api_key: ""
  api_secret: ""
  verify_ssl: true        # set false only if OPNsense uses its self-signed cert
  interface: lan
  poll_seconds: 15

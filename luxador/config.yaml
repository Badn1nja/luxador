name: El Luxador & Luxie
version: "0.3.0"
slug: luxador
description: Presence-learning lighting engine (room > zone states, soft overlays, one controller per light).
url: https://github.com/Badn1nja/luxador
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:drama-masks
panel_title: Luxador
homeassistant_api: true
map:
  - addon_config:rw   # your rooms/*.yaml, schemas.yaml, settings.yaml live here (seeded on first start)
options:
  dry_run: true
  tick_seconds: 5
  opnsense_url: ""
  opnsense_api_key: ""
  opnsense_api_secret: ""
  opnsense_verify_ssl: true
schema:
  dry_run: bool
  tick_seconds: int(1,60)
  opnsense_url: str?
  opnsense_api_key: str?
  opnsense_api_secret: password?
  opnsense_verify_ssl: bool
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direct web UI (optional; the sidebar panel works without it)
